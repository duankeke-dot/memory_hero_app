name: memory_hero
description: 儿童记忆与阅读障碍训练 APP
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # 状态管理
  provider: ^6.1.1
  flutter_bloc: ^8.1.3
  
  # 本地存储
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.1
  
  # 网络请求
  dio: ^5.4.0
  
  # 图表
  fl_chart: ^0.65.0
  percent_indicator: ^4.2.3
  
  # 动画
  lottie: ^2.7.0
  animate_do: ^3.1.2
  
  # 音频
  audioplayers: ^5.2.1
  
  # 其他工具
  uuid: ^4.2.2
  intl: ^0.18.1
  flutter_countdown_timer: ^4.1.0
  confetti: ^0.7.0
  
  # UI 组件
  cupertino_icons: ^1.0.6
  flutter_screenutil: ^5.9.0
  cached_network_image: ^3.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.7

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/audio/
  
  fonts:
    - family: ReadingFriendly
      fonts:
        - asset: assets/fonts/ReadingFriendly.ttf
